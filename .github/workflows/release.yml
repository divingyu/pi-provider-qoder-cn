name: Release

on:
  push:
    tags:
      - "v*"
  # Lets a failed release be retried from the Actions UI without deleting and
  # recreating the tag. The version still comes from package.json, so the tag
  # check below only runs for tag-triggered releases.
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance (OIDC).
  id-token: write

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: deliberately no `registry-url` here.
      #
      # When registry-url is set, setup-node writes
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # into .npmrc. With no NODE_AUTH_TOKEN (the normal state for OIDC), that
      # interpolates to an empty token, npm sends it, and the registry rejects
      # the request before the OIDC exchange happens — the run fails with
      # ENEEDAUTH or a bare 404. The registry defaults to npmjs.org, so leaving
      # this out is what makes trusted publishing work.
      # See actions/setup-node#1551 and npm/documentation#1960.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Trusted Publishing (OIDC) requires npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::notice::Manual run; publishing package.json version $PKG_VERSION"
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Two authentication paths, in order of preference:
      #
      #   1. Trusted Publishing (OIDC) — nothing configured, nothing to leak.
      #      The job exchanges its short-lived GitHub OIDC token for a one-time
      #      npm publish credential. Requires a trusted publisher configured for
      #      this package on npmjs.com (package -> Settings -> Trusted Publisher),
      #      which in turn requires 2FA enabled on the npm account.
      #   2. A granular access token in the NPM_TOKEN repository secret, with
      #      "Bypass 2FA" enabled. Used only when OIDC is not configured.
      #
      # Writing _authToken unconditionally would disable path 1, so the token is
      # only written when the secret is actually present. npm reads ~/.npmrc at
      # publish time, after this step.
      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Confirm the OIDC request channel exists. `id-token: write` makes
          # GitHub inject these two variables; without them npm's OIDC helper
          # silently skips the exchange and publishing fails with ENEEDAUTH.
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "::notice::GitHub OIDC request channel is available (id-token: write is in effect)."
          else
            echo "::warning::ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN are not set, so npm cannot perform the OIDC exchange."
          fi
          echo "::notice::npm $(npm --version) | node $(node --version)"
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            echo "::notice::Authenticating with a granular access token from the NPM_TOKEN secret."
          else
            echo "::notice::No NPM_TOKEN secret set; authenticating with Trusted Publishing (OIDC)."
          fi

      # Publishes via Trusted Publishing (OIDC) or the NPM_TOKEN secret.
      # npm publish runs prepublishOnly (check + build) again as a safety net.
      #
      # The publish failure reason is surfaced as workflow annotations: the raw
      # job log is only visible to repository admins, while annotations are
      # readable by anyone who can see the run. That makes a failed release
      # diagnosable without downloading logs.
      - name: Publish to npm
        id: publish
        run: |
          set +e
          # npm's OIDC helper never throws: on any failure it logs at verbose
          # level and returns undefined, after which npm falls back to ordinary
          # token auth and fails with ENEEDAUTH. That makes the real cause
          # invisible unless verbose logging is on, so turn it on for this step.
          npm publish --provenance --access public --loglevel verbose 2>&1 | tee /tmp/publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::npm publish failed (the registry or OIDC reason is in the annotations below)"
            grep -iE 'npm error|oidc|ENEEDAUTH|E[0-9]{3}|401|403|404|provenance|not permitted|unable to authenticate' /tmp/publish.log \
              | grep -v '^npm error A complete log' \
              | tail -20 \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
          fi
          exit "$status"
